services:
  backend:
    env_file: !reset []
    environment:
      XAI_API_KEY: deterministic-test-key
    ports: !override
      - "127.0.0.1:18080:8000"
    volumes:
      - ./backend/tests/container_acceptance_app.py:/app/acceptance_app.py:ro
      - ./backend/tests/safety_scripted_model.py:/app/safety_scripted_model.py:ro
    command:
      - uvicorn
      - acceptance_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --timeout-graceful-shutdown
      - "10"
