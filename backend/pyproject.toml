[project]
name = "autoassist"
version = "0.1.0"
description = "Dealership inventory API foundation for AutoAssist"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "fastapi==0.116.1",
    "pydantic-ai-slim[google,openai,xai]==2.42.0",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[project.scripts]
autoassist-import-inventory = "autoassist.inventory.import_cli:main"

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "mypy==1.17.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
