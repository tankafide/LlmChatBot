services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - autoassist-data:/data
      - ./config/dealerships.json:/app/config/dealerships.json:ro
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile.verify
    environment:
      AUTOASSIST_DATABASE_URL: sqlite:////tmp/autoassist-check.db
      AUTOASSIST_CONFIG_FILE: /workspace/config/dealerships.json
    volumes:
      - ./docs/context/inventory:/workspace/docs/context/inventory:ro

volumes:
  autoassist-data:
